[project]
name = "ghevents"
version = "0.1.0"
description = "Parse GH events"
readme = "README.md"
authors = [
    { name = "hasssan12345", email = "75430735+hasssan12345@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
ghevents = "ghevents:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
